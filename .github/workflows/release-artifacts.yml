name: Prepare release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nu --no-config-file {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: hustcer/setup-nu@1b8faed9a8ff673c8ce0beae243e0b72d0787241 # v3
        with:
          version: "0.116.1"
      - run: |
          if $env.RELEASE_VERSION !~ '^[0-9]+\.[0-9]+\.[0-9]+$' {
            error make {msg: "Expected a version in major.minor.patch format"}
          }
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - run: ^go test ./...
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.20.0
          args: release --snapshot --clean
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          let prefix = $"terraform-provider-k3s_($env.RELEASE_VERSION)"
          cp terraform-registry-manifest.json $"dist/($prefix)_manifest.json"
          cd dist
          ^sha256sum -c $"($prefix)_SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-provider-k3s-packages
          path: |
            dist/*.zip
            dist/*_manifest.json
            dist/*_SHA256SUMS
